[package]
name = "y4p"
version = "0.2.5"
edition = "2024"
description = "A robust, unified clipboard manager for Wayland with SQLite storage."
license = "GPL-3.0-or-later"

[dependencies]
# --- Wayland Core ---
wayland-client = "0.31.14"
wayland-protocols = { version = "0.32.12", features = ["client", "staging"] }

# --- Storage ---
# 'bundled' ensures standalone compilation and cross-environment robustness
# without relying on system-installed SQLite packages.
rusqlite = { version = "0.40.0", default-features = false, features = ["bundled", "modern_sqlite"] }

# --- Utilities ---
# For robust pipe communication and avoiding runtime deadlocks.
libc = "0.2.186"
# For payload deduplication via unique content fingerprints.
sha3 = "0.12.0"
# For calculating terminal layout bounds accurately (supports full/half-width).
unicode-width = "0.2.2"
# For file path percent-encoding/decoding.
percent-encoding = "2.3.2"
# For handling terminal signals (e.g., SIGINT/Ctrl+C).
ctrlc = "3.5.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"

# y4p is a resident daemon, and this profile's `panic = "abort"` means an
# unwrap()/expect()/panic! anywhere in its call graph — even inside a
# spawned worker thread — aborts the *whole* process, not just that thread.
# Denied crate-wide; `src/cli` (the CLI entry point) and `#[cfg(test)]` code
# carve out their own `#![allow(...)]`/`#[allow(...)]` overrides where a
# hard failure or test assertion is actually the correct behavior.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

