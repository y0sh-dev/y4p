[workspace]
# The root package (`y4p`, the binary) is an implicit member. Domain crates
# are added under `crates/` one milestone at a time (see
# ROADMAP_MODULARIZATION.md); dependencies flow strictly inward towards `core`.
members = ["crates/core", "crates/storage", "crates/image", "crates/wayland", "crates/cli", "crates/daemon"]
resolver = "3"

[workspace.package]
# Single source of truth: every member inherits these, so a release bump
# touches exactly one line.
version = "0.6.7"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Shared by more than one member, pinned once. Crates used by a single member
# are declared in that member's own manifest instead.
libc = "0.2.186"
# Payload fingerprints: the daemon's worker and the storage layer must agree
# on the digest, so both pull the same pinned version.
sha3 = "0.12.0"
# Wayland client bindings: used by the protocol crate and by the daemon's event
# loop, which names `wayland_client` types directly.
wayland-client = "0.31.14"

[package]
name = "y4p"
version.workspace = true
edition.workspace = true
description = "A robust, unified clipboard manager for Wayland with SQLite storage."
license.workspace = true

[dependencies]
# --- Workspace Members ---
# Shared domain types, constants, configuration and XDG path resolution.
y4p-core = { path = "crates/core" }
# SQLite store, schema migrations and the filesystem blob cache. `rusqlite`
# is encapsulated there; the binary never touches it directly.
y4p-storage = { path = "crates/storage" }
# Wayland protocol handlers and streaming clipboard I/O. `wayland-protocols`
# is encapsulated there.
y4p-wayland = { path = "crates/wayland" }
# Command-line frontend: argument parsing, dispatch and output formatting.
# `unicode-width` is encapsulated there.
y4p-cli = { path = "crates/cli" }
# Resident daemon: IPC socket lifecycle, event loop and background DB worker.
# `wayland-client` is encapsulated there and in `y4p-wayland`; the local image
# pipeline (`y4p-image`) is reached only through it.
y4p-daemon = { path = "crates/daemon" }

# --- Utilities ---
# For robust pipe communication and avoiding runtime deadlocks.
libc.workspace = true
# For handling terminal signals (e.g., SIGINT/Ctrl+C).
ctrlc = "3.5.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"

# y4p is a resident daemon, and this profile's `panic = "abort"` means an
# unwrap()/expect()/panic! anywhere in its call graph — even inside a
# spawned worker thread — aborts the *whole* process, not just that thread.
# Denied workspace-wide: every member opts in with `[lints] workspace = true`
# (so the policy cannot drift between crates as more are extracted).
# `src/cli` (the CLI entry point) and `#[cfg(test)]` code carve out their own
# `#![allow(...)]`/`#[allow(...)]` overrides where a hard failure or test
# assertion is actually the correct behavior.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "warn"
cast_lossless = "warn"
redundant_clone = "warn"

[lints]
workspace = true
